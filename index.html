<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brújula Interior Gamificada</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Poppins',sans-serif;
background:linear-gradient(135deg,#fff5f7,#f8f1ec);
color:#4b3b40;
}

/* 🔥 CONTENEDOR PRINCIPAL AJUSTADO (quita espacio inferior Moodle) */
.wrapper{
max-width:1300px;
margin:auto;
padding:20px 30px 5px 30px;
}

.hero{
background:linear-gradient(135deg,#fff,#fff7fb);
padding:35px;
border-radius:30px;
box-shadow:0 20px 60px rgba(0,0,0,.08);
margin-bottom:18px;
}

.hero h1{
font-size:48px;
background:linear-gradient(90deg,#d58ab1,#ef8f6d,#f0b55c);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.start{
text-align:center;
background:white;
padding:30px;
border-radius:25px;
box-shadow:0 12px 35px rgba(0,0,0,.08);
}

.btn{
padding:16px 30px;
border:none;
border-radius:999px;
background:linear-gradient(135deg,#d58ab1,#ef8f6d);
color:white;
font-size:16px;
cursor:pointer;
}

.game{display:none;}

.question{
font-size:30px;
font-weight:700;
margin-bottom:18px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:18px;
}

/* 🔥 TARJETAS MEJORADAS */
.card{
background:white;
border-radius:22px;
overflow:hidden;
cursor:pointer;
transition:.25s ease;
box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.card:hover{
transform:translateY(-10px);
box-shadow:0 18px 40px rgba(0,0,0,.15);
}

/* 🔥 IMÁGENES MÁS GRANDES Y PRO */
.img{
height:190px;
background-size:cover;
background-position:center;
transition:transform .3s ease;
}

.card:hover .img{
transform:scale(1.05);
}

.content{
padding:15px;
font-weight:600;
font-size:15px;
}

/* 🔥 RESULTADO MÁS COMPACTO */
.result{
margin-top:18px;
background:linear-gradient(135deg,#fff,#fff8fb);
padding:18px;
border-radius:18px;
display:none;
}

.result.active{display:block;}

/* 🔥 ELIMINAR ESPACIO INFERIOR MOODLE */
html, body{
height:auto !important;
min-height:unset !important;
}

.wrapper{
padding-bottom:5px !important;
margin-bottom:0 !important;
}

.game{
margin-bottom:0 !important;
padding-bottom:0 !important;
}

</style>
</head>

<body>

<div class="wrapper">

<div class="hero">
<h1>Brújula Interior</h1>
<p>Explora tu orientación interior a través de decisiones simbólicas.</p>
</div>

<div class="start" id="start">
<h2>Inicia tu exploración</h2>
<p>Selecciona lo que más resuene contigo.</p>
<button class="btn" onclick="start()">Comenzar</button>
</div>

<div class="game" id="game">

<div class="question" id="question"></div>
<div class="grid" id="grid"></div>

<div class="result" id="result">
<h2 id="rTitle"></h2>
<p id="rText"></p>
<button class="btn" onclick="next()">Continuar</button>
</div>

</div>

</div>

<script>

const data = [

{
q:"1. Expansión y Aprendizaje",
options:[
{t:"Aprendizaje",c:"expansion",img:"https://images.unsplash.com/photo-1522202176988-66273c2fd55f"},
{t:"Crear Innovación",c:"expansion",img:"https://images.unsplash.com/photo-1518770660439-4636190af475"},
{t:"Conciencia",c:"proposito",img:"https://images.unsplash.com/photo-1470770841072-f978cf4d019e"},
{t:"Claridad Interior",c:"proposito",img:"https://images.unsplash.com/photo-1500534623283-312aade485b7"},
{t:"Visión",c:"expansion",img:"https://images.unsplash.com/photo-1500530855697-b586d89ba3ee"}
]
},

{
q:"2. Impacto y Transformación",
options:[
{t:"Transformar Comunidades",c:"impacto",img:"https://images.unsplash.com/photo-1529156069898-49953e39b3ac"},
{t:"Inspirar Personas",c:"impacto",img:"https://images.unsplash.com/photo-1522202176988-66273c2fd55f"},
{t:"Liderazgo",c:"impacto",img:"https://images.unsplash.com/photo-1504384308090-c894fdcc538d"},
{t:"Impacto",c:"impacto",img:"https://images.unsplash.com/photo-1521737604893-d14cc237f11d"},
{t:"Humanidad",c:"impacto",img:"https://images.unsplash.com/photo-1517486808906-6ca8b3f04846"}
]
},

{
q:"3. Equilibrio y Bienestar",
options:[
{t:"Seguridad",c:"equilibrio",img:"https://images.unsplash.com/photo-1500530855697-b586d89ba3ee"},
{t:"Calma",c:"equilibrio",img:"https://images.unsplash.com/photo-1507525428034-b723cf961d3e"},
{t:"Encontrar Paz",c:"equilibrio",img:"https://images.unsplash.com/photo-1500534623283-312aade485b7"},
{t:"Crear Bienestar",c:"equilibrio",img:"https://images.unsplash.com/photo-1497215842964-222b430dc094"},
{t:"Armonía",c:"equilibrio",img:"https://images.unsplash.com/photo-1506126613408-eca07ce68773"}
]
},

{
q:"4. Fortaleza y Resiliencia",
options:[
{t:"Resiliencia",c:"fortaleza",img:"https://images.unsplash.com/photo-1500534623283-312aade485b7"},
{t:"Confianza",c:"fortaleza",img:"https://images.unsplash.com/photo-1493246507139-91e8fad9978e"},
{t:"Fortaleza",c:"fortaleza",img:"https://images.unsplash.com/photo-1499750310107-5fef28a66643"},
{t:"Determinación",c:"fortaleza",img:"https://images.unsplash.com/photo-1517836357463-d25dfeac3438"},
{t:"Disciplina",c:"fortaleza",img:"https://images.unsplash.com/photo-1522202176988-66273c2fd55f"}
]
},

{
q:"5. Propósito y Consciencia",
options:[
{t:"Claridad Interior",c:"proposito",img:"https://images.unsplash.com/photo-1500534623283-312aade485b7"},
{t:"Conciencia",c:"proposito",img:"https://images.unsplash.com/photo-1470770841072-f978cf4d019e"},
{t:"Visión",c:"proposito",img:"https://images.unsplash.com/photo-1500530855697-b586d89ba3ee"},
{t:"Propósito",c:"proposito",img:"https://images.unsplash.com/photo-1516321318423-f06f85e504b3"},
{t:"Empatía",c:"impacto",img:"https://images.unsplash.com/photo-1517486808906-6ca8b3f04846"}
]
}

];

let i=0;
let score={expansion:0,impacto:0,equilibrio:0,fortaleza:0,proposito:0};

function start(){
document.getElementById("start").style.display="none";
document.getElementById("game").style.display="block";
load();
}

function load(){

const q=data[i];
document.getElementById("question").innerText=q.q;

const grid=document.getElementById("grid");
grid.innerHTML="";

q.options.forEach(o=>{
const div=document.createElement("div");
div.className="card";
div.innerHTML=`
<div class="img" style="background-image:url('${o.img}')"></div>
<div class="content">${o.t}</div>
`;
div.onclick=()=>select(o);
grid.appendChild(div);
});
}

function select(o){
score[o.c]++;
document.getElementById("result").classList.add("active");
document.getElementById("rTitle").innerText=o.t;
document.getElementById("rText").innerText="Tu elección refleja tu orientación interior.";
}

function next(){
i++;
if(i>=data.length){
finish();
return;
}
document.getElementById("result").classList.remove("active");
load();
}

function finish(){

const top=Object.keys(score).reduce((a,b)=>score[a]>score[b]?a:b);

const results={
expansion:"Expansión y Aprendizaje: curiosidad, innovación y crecimiento continuo.",
impacto:"Impacto y Transformación: servicio, liderazgo y contribución a otros.",
equilibrio:"Equilibrio y Bienestar: calma, estabilidad y armonía interior.",
fortaleza:"Fortaleza y Resiliencia: disciplina, confianza y superación.",
proposito:"Propósito y Consciencia: sentido de vida, claridad y conexión interior."
};

document.getElementById("question").innerText="Resultado final";
document.getElementById("grid").innerHTML="";
document.getElementById("result").classList.add("active");
document.getElementById("rTitle").innerText=top.toUpperCase();
document.getElementById("rText").innerText=results[top];
}

</script>

</body>
</html>
